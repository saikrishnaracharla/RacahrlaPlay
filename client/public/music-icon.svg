<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B7DB3"/>
      <stop offset="100%" style="stop-color:#8B9DC3"/>
    </linearGradient>
    <linearGradient id="letter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9AAAD4"/>
      <stop offset="100%" style="stop-color:#B0BED9"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- White border inset -->
  <rect x="20" y="20" width="472" height="472" rx="80" ry="80" fill="none" stroke="white" stroke-width="18"/>

  <!-- R — left side -->
  <!-- Vertical stem of R -->
  <rect x="72" y="72" width="52" height="368" fill="white"/>
  <!-- Top bar of R -->
  <rect x="72" y="72" width="170" height="52" fill="white"/>
  <!-- Mid bar of R -->
  <rect x="72" y="210" width="160" height="48" fill="white"/>
  <!-- Bowl curve of R (top arc) -->
  <path d="M 124 72 Q 270 72 270 165 Q 270 258 124 258" fill="none" stroke="white" stroke-width="52"/>
  <!-- Leg of R (diagonal) -->
  <line x1="172" y1="258" x2="290" y2="440" stroke="white" stroke-width="52" stroke-linecap="round"/>

  <!-- Play button triangle (white, center-right area) -->
  <polygon points="260,180 390,256 260,332" fill="white"/>

  <!-- P — right side -->
  <!-- Vertical stem of P -->
  <rect x="348" y="72" width="50" height="368" fill="white"/>
  <!-- Top bar of P -->
  <rect x="348" y="72" width="108" height="48" fill="white"/>
  <!-- Mid bar of P -->
  <rect x="348" y="210" width="108" height="48" fill="white"/>
  <!-- Bowl of P -->
  <path d="M 398 72 Q 490 72 490 165 Q 490 258 398 258" fill="none" stroke="white" stroke-width="48"/>
</svg>
